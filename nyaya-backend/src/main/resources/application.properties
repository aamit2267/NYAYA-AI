# ==============================================================
# NYAYA-AI: BACKEND CONFIGURATION
# ==============================================================

# --- 1. Server Configuration ---
# Explicitly setting the port. The Next.js frontend will make calls to http://localhost:8080
server.port=${SERVER_PORT:8080}
spring.application.name=nyaya-backend

# --- 2. Database Connection (PostgreSQL) ---
# Connecting to the local Docker container we spun up earlier.
spring.datasource.url=jdbc:postgresql://localhost:${HOST_DB_PORT:5432}/${POSTGRES_DB:nyaya_db}
spring.datasource.username=${POSTGRES_USER:bhartiya_nayaya_ai}
spring.datasource.password=${POSTGRES_PASSWORD:bhartiya_nayaya_ai_security@2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- 3. JPA & Hibernate Configuration ---
# 'update' automatically creates or modifies database tables based on your Java code.
# This is perfect for rapid local development but should be 'validate' or 'none' in production.
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the terminal (Crucial for debugging and ensuring pgvector works correctly)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tell Hibernate we are using PostgreSQL (helps with specific data types)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- 4. LangChain4j & Ollama Configuration (Placeholders) ---
# We will use these in the next step when we wire up the local AI.
# The default port for Ollama is 11434.
nyaya.ai.ollama.base-url=http://localhost:11434
nyaya.ai.ollama.chat-model=mistral
nyaya.ai.ollama.embedding-model=nomic-embed-text


# --- 5. Frontend Configuration ---
# CORS Configuration: Allowing the Next.js frontend to communicate with our Spring Boot backend.
# In production, you should restrict this to your actual frontend domain.
nyaya.frontend.url=${FRONTEND_URL:http://localhost:3000}

# --- 6. File Upload Configuration ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- 7. Actuator CORS & Exposure Configuration ---
# Expose the health endpoint
management.endpoints.web.exposure.include=health

# Actuator specific CORS settings
management.endpoints.web.cors.allowed-origins=${nyaya.frontend.url:http://localhost:3000}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allow-credentials=true

# Modern Encoding standard
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true

# Ensure Jackson handles Records correctly
spring.jackson.visibility.field=any
spring.jackson.visibility.getter=any